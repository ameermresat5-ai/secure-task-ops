name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
      - feature/devops-setup

jobs:
  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run backend tests
        run: |
          if [ -d tests ]; then pytest; else echo "No backend tests found"; fi

  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; else echo "No frontend package.json found"; fi

      - name: Build frontend
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "No frontend build found"; fi
