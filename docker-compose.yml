services:
  postgres:
    image: postgres:16-alpine
    container_name: securetaskops-postgres
    environment:
      POSTGRES_DB: securetaskops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securetaskops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: securetaskops-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/securetaskops
      SECRET_KEY: dev-secret-key
      FLASK_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: securetaskops-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
